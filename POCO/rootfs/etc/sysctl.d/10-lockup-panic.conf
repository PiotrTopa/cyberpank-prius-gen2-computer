# Turn kernel oopses into panics -> reboot after 10 s, instead of a half-dead
# system that only the hardware watchdog (30 s) can eventually clear.
# (softlockup/hung_task detectors are not built into this pmOS kernel.)
# Complements /etc/systemd/system.conf.d/10-watchdog.conf.
kernel.panic = 10
kernel.panic_on_oops = 1
