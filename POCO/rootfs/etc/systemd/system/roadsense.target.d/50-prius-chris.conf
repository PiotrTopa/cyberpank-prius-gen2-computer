# Prius car computer (cyberpank-prius-gen2-computer POCO/rootfs, lane L44, 2026-11-20):
# chris-integrator is part of the perception stack. The backend's roadsense manager
# starts and stops only roadsense.target (with ACC, or mode on/off); this pulls the
# integrator in with it. Harmless while chris-integrator.service is not installed
# (Wants= of a missing unit is ignored): the old roadsense layout keeps working.
[Unit]
Wants=chris-integrator.service
