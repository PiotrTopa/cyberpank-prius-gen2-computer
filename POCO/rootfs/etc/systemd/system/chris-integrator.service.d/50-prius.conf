# Prius car computer (cyberpank-prius-gen2-computer POCO/rootfs, lane L44, 2026-11-20).
# chris-integrator runs as a unit of roadsense.target: stopped and restarted with it
# (PartOf), on the CPUs of roadsense.slice (cpu3 is the backend's, prius.slice).
# Never enable it under multi-user.target: a listed unit that runs permanently makes
# the backend manager's stop time out (provision.sh disables it).
#
# Ports on this car: 8080 is the backend, 8081/8082 its ZeroMQ. The integrator's
# consolidated API goes to 8090 on loopback (the backend proxies it under
# /api/v1/roadsense and /roadsense/), roadsense's per-camera debug face to 8091.
# These are defaults: /etc/chris/integrator.env (EnvironmentFile of the unit, written
# by chris-integrator/scripts/install.sh API_PORT=.. API_HOST=.. ROADSENSE_HTTP=..)
# overrides them.
[Unit]
PartOf=roadsense.target
After=roadsense-api.service

[Service]
Slice=roadsense.slice
Environment=CHRIS_API_HOST=127.0.0.1
Environment=CHRIS_API_PORT=8090
Environment=CHRIS_ROADSENSE_HTTP=http://127.0.0.1:8091
