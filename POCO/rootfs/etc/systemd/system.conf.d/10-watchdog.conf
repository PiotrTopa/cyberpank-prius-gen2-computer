# Hardware watchdog (qcom_wdt APSS WDT @ 17980000).
#
# Why: the sdm845 SoC has been observed to HARD-FREEZE (kernel dead, zero
# network, no panic, nothing in the journal — 2x on 2026-07-10, once even
# ~70 s into early boot). A frozen kernel can't be recovered by any software
# watchdog (prius-netwatch) and previously stayed dark for hours until a
# manual power-cycle.
#
# systemd PID 1 opens /dev/watchdog0 and pets it; if the kernel locks up,
# the APSS WDT bites and the SoC self-resets within 30 s.
# Note: qcom_wdt rejects timeouts >~37 s ("Invalid argument" at 60 s), so 30 s.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=30
